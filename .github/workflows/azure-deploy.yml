name: Build and deploy to Azure

# Builds the standalone Next.js server on Linux - which is what makes sharp's
# native binaries match App Service - and zip-deploys it. No container
# registry is involved; the Dockerfile is still there for hosts that want an
# image. See docs/AZURE-DEPLOY.md for the one-time setup.
#
# Needs, on this repository:
#   variable AZURE_WEBAPP_NAME        the Web App's name
#   variable AZURE_CLIENT_ID          the deploy app registration
#   variable AZURE_TENANT_ID          the directory it lives in
#   variable AZURE_SUBSCRIPTION_ID    the subscription holding the Web App
#
# Sign-in is OIDC: the app registration trusts this repository through a
# federated credential scoped to the production environment, so no password
# is stored anywhere. None of the four values above is a secret.
#
# The deploy job is skipped until the variable is set, so the build still runs
# (and still catches broken code) before Azure exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run typecheck

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # NEXT_PUBLIC_* are inlined into the browser bundle at build time, so
          # they belong here rather than in the Web App settings. Every one of
          # them is public by design - the browser receives all of them.
          # Defaults are this site's own values. They are not secrets: the
          # browser receives every one of them, and Supabase states plainly
          # that a publishable key is safe to share. Set the matching
          # repository variable to override any of them.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://onlinecolorpage.com' }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.NEXT_PUBLIC_SITE_NAME || 'Online Color Page' }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://dqtkogyediyzqcvawfnn.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_ymSlf1QvDhg-x5oRkkBmNQ__YzWpBwM' }}
          NEXT_PUBLIC_ADSENSE_CLIENT: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID || 'G-R9KND3HC3S' }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          R2_PUBLIC_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL || 'https://cdn.onlinecolorpage.com' }}
        run: npm run build

      - name: Assemble the standalone server
        # `output: 'standalone'` leaves static assets and public/ outside the
        # bundle, so they have to be put back before it can run anywhere.
        run: |
          cp -r public .next/standalone/public
          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: .next/standalone
          # .next/static sits inside a dot-directory, which is skipped otherwise.
          include-hidden-files: true
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: vars.AZURE_WEBAPP_NAME != '' && vars.AZURE_CLIENT_ID != ''
    permissions:
      id-token: write
      contents: read
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://onlinecolorpage.com' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: app

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A plain zip deploy MERGES into wwwroot: files in the zip overwrite
      # their counterparts and everything else is left alone. The previous
      # build's prerendered HTML then survives under .next/server/app/ and is
      # served with Server Action ids the new server does not know, so every
      # action fails with UnrecognizedActionError while the pages look fine.
      # --clean wipes the target first, which is the only way the
      # replacement is complete.
      - name: Deploy, replacing what is already there
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP || 'onlinecolorpage-rg' }}
          APP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          (cd app && zip -qr ../app.zip .)
          az webapp deploy \
            --resource-group "$RG" \
            --name "$APP" \
            --src-path app.zip \
            --type zip \
            --clean true \
            --restart true

      - name: Wait for the health check
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP || 'onlinecolorpage-rg' }}
          APP: ${{ vars.AZURE_WEBAPP_NAME }}
        run: |
          host=$(az webapp show -g "$RG" -n "$APP" --query defaultHostName -o tsv)
          url="https://$host/api/health"
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$url" > /dev/null; then
              echo "Healthy after $attempt attempt(s)."
              exit 0
            fi
            echo "Not ready yet (attempt $attempt) - retrying in 10s."
            sleep 10
          done
          echo "::error::App did not become healthy within 5 minutes."
          exit 1
